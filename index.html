<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="game">
        <section class="slide slide--world is-active" id="world-slide" aria-hidden="false">
            <header class="slide__header">
                <a href="https://mhisa.org/" target="_blank" rel="noopener noreferrer" aria-label="Visit MHISA website">
                    <img class="logo" src="images/MHISA Logo Transparent.png"
                        alt="MHISA - Mental Health Initiative for South Asians" />
                </a>
            </header>
            <div class="slide__content">
                <h1 class="slide__title">The Game</h1>
                <div class="playfield">
                    <canvas id="game-canvas" width="640" height="480" role="img"
                        aria-label="Top-down map with grass, trees, and a tiny trainer sprite"></canvas>
                    <button class="btn btn--secondary btn--accent btn--small fullscreen-btn" id="fullscreen-toggle"
                        type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
                        <span class="fullscreen-btn__icon" aria-hidden="true">&#9974;</span>
                    </button>
                    <div class="dialog-box" id="dialog-box" hidden>
                        <p class="dialog-text" id="dialog-text" aria-live="polite"></p>
                        <button class="dialog-next" id="dialog-next" type="button" aria-label="Next">|&gt;</button>
                    </div>
                    <div class="loading-overlay" id="loading-overlay" hidden>
                        <div class="loading-spinner" aria-hidden="true"></div>
                        <p>Loading...</p>
                    </div>
                    <div class="guide-popup" id="guide-popup" hidden>
                        <div class="guide-popup__body">
                            <div class="guide-popup__face" aria-hidden="true"></div>
                            <div class="guide-popup__content">
                                <div class="guide-popup__header">
                                    <h3 id="guide-popup-title">The Guide Master</h3>
                                </div>
                                <p id="guide-popup-line"></p>
                                <div class="guide-popup__actions">
                                    <button class="btn btn--accent btn--small" id="guide-popup-next"
                                        type="button">Next</button>
                                    <button class="btn btn--secondary btn--small" id="guide-popup-option-2"
                                        type="button" hidden></button>
                                    <button class="btn btn--secondary btn--small" id="guide-popup-option-3"
                                        type="button" hidden></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="guide-avatar" id="guide-avatar" type="button" aria-label="Open quests" hidden>
                        <span class="guide-avatar__face"></span>
                        <span class="guide-avatar__alert" id="guide-avatar-alert" hidden>!</span>
                    </button>
                    <div class="guide-quests" id="guide-quests" hidden>
                        <div class="guide-quests__header">
                            <span>Quests</span>
                            <button class="guide-quests__close" id="guide-quests-close" type="button"
                                aria-label="Close quests">&times;</button>
                        </div>
                        <p class="guide-quests__empty">No Quests</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <button class="btn btn--small story-reset" id="story-reset" type="button">Reset Story</button>
    <div id="toast" class="toast" aria-live="polite" aria-atomic="true"></div>
    <script src="script.js"></script>
</body>

</html>
