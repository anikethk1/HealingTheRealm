<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHISA - The Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="game">
        <section class="slide slide--intro is-active" id="intro-slide" aria-hidden="false">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <h1 class="slide__title">THE GAME</h1>
                <blockquote class="slide__quote">
                    "It's okay to not be okay.<br />What matters is that you're taking care of yourself."
                </blockquote>
                <button class="btn btn--gradient" id="start-game" type="button" aria-controls="world-slide">
                    ▶ Start Game
                </button>
            </div>
        </section>

        <section class="slide slide--world" id="world-slide" aria-hidden="true">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <h1 class="slide__title">CHOOSE YOUR WORLD</h1>
                <button class="btn btn--secondary" data-target="intro-slide" aria-label="Back to Home Screen">Back to Home</button>
                <div class="world-grid" role="list">
                    <button class="world-card world-card--green" data-target="home-world" role="listitem">Home World</button>
                    <button class="world-card world-card--pink" data-target="friendship-world" role="listitem">Friendship World</button>
                    <button class="world-card world-card--purple" data-target="school-world" role="listitem">School World</button>
                    <button class="world-card world-card--orange" data-target="dream-world" role="listitem">Dream World</button>
                </div>
            </div>
        </section>
        <section class="slide slide--home" id="home-world" aria-hidden="true">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <div class="coming-soon" role="region" aria-label="Home World Coming Soon">
                    <svg class="lock" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                        <path fill="currentColor" d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 116 0v3z"/>
                    </svg>
                    <h2>Coming Soon</h2>
                    <button class="btn" data-target="world-slide">Back to Worlds</button>
                </div>
            </div>
        </section>
        <section class="slide slide--friendship" id="friendship-world" aria-hidden="true">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <div class="coming-soon" role="region" aria-label="Friendship World Coming Soon">
                    <svg class="lock" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                        <path fill="currentColor" d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 116 0v3z"/>
                    </svg>
                    <h2>Coming Soon</h2>
                    <button class="btn" data-target="world-slide">Back to Worlds</button>
                </div>
            </div>
        </section>
        <section class="slide slide--school" id="school-world" aria-hidden="true">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <div class="coming-soon" role="region" aria-label="School World Coming Soon">
                    <svg class="lock" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                        <path fill="currentColor" d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 116 0v3z"/>
                    </svg>
                    <h2>Coming Soon</h2>
                    <button class="btn" data-target="world-slide">Back to Worlds</button>
                </div>
            </div>
        </section>
        <section class="slide slide--dream" id="dream-world" aria-hidden="true">
            <header class="slide__header">
                <img class="logo" src="MHISA Logo Transparent.png"
                    alt="MHISA - Mental Health Initiative for South Asians" />
            </header>
            <div class="slide__content">
                <div class="coming-soon" role="region" aria-label="Dream World Coming Soon">
                    <svg class="lock" viewBox="0 0 24 24" width="72" height="72" aria-hidden="true">
                        <path fill="currentColor" d="M12 1a5 5 0 00-5 5v3H6a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2v-8a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 116 0v3z"/>
                    </svg>
                    <h2>Coming Soon</h2>
                    <button class="btn" data-target="world-slide">Back to Worlds</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
